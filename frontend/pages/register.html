<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – ContactVault CMS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-left">
    <div class="auth-hero-logo">Contact<span>Vault</span></div>
    <p class="auth-hero-text">Join thousands of users who organise their world with ContactVault.</p>
  </div>

  <div class="auth-right">
    <div class="auth-form-wrapper">
      <h1 class="auth-heading">Create account</h1>
      <p class="auth-subheading">Start managing contacts in seconds</p>

      <!-- Role Toggle -->
      <div class="role-toggle">
        <div class="role-option selected" data-role="user" onclick="selectRole('user',this)">
          <div class="role-option-icon">👤</div>
          <div class="role-option-label">User</div>
        </div>
        <div class="role-option" data-role="admin" onclick="selectRole('admin',this)">
          <div class="role-option-icon">🛡️</div>
          <div class="role-option-label">Admin</div>
        </div>
      </div>

      <div id="errorMsg" class="form-error mb-4 hidden"></div>
      <div id="successMsg" class="hidden" style="color:var(--success);font-size:.875rem;margin-bottom:12px;"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Jane Smith" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="jane@example.com" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm" placeholder="Repeat password" />
        </div>
      </div>

      <button class="btn btn-primary w-full btn-lg mt-2" id="registerBtn" onclick="handleRegister()">
        Create Account
      </button>

      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Sign in →</a>
      </p>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, updateProfile
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvZaj0f3dd6solN2rnz32aD6C-B5DnbQE",
    authDomain: "contactvault-cms.firebaseapp.com",
    projectId: "contactvault-cms",
    storageBucket: "contactvault-cms.firebasestorage.app",
    messagingSenderId: "137656530358",
    appId: "1:137656530358:web:1432d27521d77054fbfd17",
    measurementId: "G-LZ1EYVPHEF"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let selectedRole = 'user';

  window.selectRole = (role, el) => {
    selectedRole = role;
    document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  };

  window.showError = (msg) => {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
  };

  window.handleRegister = async () => {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const btn      = document.getElementById('registerBtn');

    if (!name || !email || !password) { window.showError('All fields are required.'); return; }
    if (password.length < 6)          { window.showError('Password must be at least 6 characters.'); return; }
    if (password !== confirm)         { window.showError('Passwords do not match.'); return; }

    btn.disabled = true; btn.textContent = 'Creating account…';

    try {
      const { user } = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(user, { displayName: name });

      // Save profile to Firestore
      await setDoc(doc(db, 'users', user.uid), {
        uid: user.uid, name, email,
        role: selectedRole,
        photoURL: null,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem('idToken', await user.getIdToken());
      localStorage.setItem('userRole', selectedRole);
      localStorage.setItem('uid', user.uid);

      document.getElementById('successMsg').textContent = '✅ Account created! Redirecting…';
      document.getElementById('successMsg').classList.remove('hidden');

      setTimeout(() => {
        if (selectedRole === 'admin') window.location.href = 'admin-dashboard.html';
        else                          window.location.href = 'user-dashboard.html';
      }, 1200);

    } catch (err) {
      btn.disabled = false; btn.textContent = 'Create Account';
      const msgs = {
        'auth/email-already-in-use': 'An account with this email already exists.',
        'auth/invalid-email'       : 'Invalid email address.',
        'auth/weak-password'       : 'Password is too weak.'
      };
      window.showError(msgs[err.code] || err.message);
    }
  };

  document.addEventListener('keydown', e => { if (e.key === 'Enter') window.handleRegister(); });
</script>
</body>
</html>
