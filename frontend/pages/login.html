<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – ContactVault CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0F1E;
      overflow: hidden;
      position: relative;
    }

    /* Animated mesh background */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 40%, rgba(37,99,235,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 60%, rgba(139,92,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 10%, rgba(16,185,129,0.08) 0%, transparent 60%);
      animation: meshMove 12s ease-in-out infinite alternate;
    }

    @keyframes meshMove {
      0%   { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.05) translate(-10px, 10px); }
    }

    /* Grid overlay */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 8s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(37,99,235,0.15); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 300px; height: 300px; background: rgba(139,92,246,0.12); bottom: -80px; right: -80px; animation-delay: 3s; }
    .orb-3 { width: 200px; height: 200px; background: rgba(16,185,129,0.1); top: 50%; right: 20%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50%       { transform: translateY(-30px) scale(1.05); }
    }

    /* Main card */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px 44px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 32px 64px rgba(0,0,0,0.5);
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
      border-radius: 16px;
      font-size: 26px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
    }

    .logo-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
    }

    .logo-name span { color: #60A5FA; }

    /* Heading */
    .card-heading {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #F8FAFC;
      text-align: center;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-bottom: 28px;
    }

    /* Role toggle */
    .role-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .role-btn:hover {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
    }

    .role-btn.active {
      border-color: #3B82F6;
      background: rgba(59,130,246,0.15);
      color: #93C5FD;
      box-shadow: 0 0 0 1px #3B82F6, 0 4px 12px rgba(59,130,246,0.25);
    }

    .role-btn span { font-size: 1.3rem; }

    /* Error box */
    .error-box {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      color: #FCA5A5;
      font-size: 0.85rem;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .error-box.show { display: flex; align-items: center; gap: 8px; }

    /* Form */
    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #F8FAFC;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder { color: rgba(255,255,255,0.25); }

    .form-input:focus {
      background: rgba(255,255,255,0.09);
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    /* Buttons */
    .btn-signin {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 6px;
      box-shadow: 0 4px 16px rgba(37,99,235,0.4);
      letter-spacing: 0.01em;
    }

    .btn-signin:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.5);
    }

    .btn-signin:active { transform: translateY(0); }
    .btn-signin:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255,255,255,0.25);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    /* Google btn */
    .btn-google {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85);
      font-size: 0.92rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-1px);
    }

    .google-icon {
      display: flex;
      align-items: center;
    }

    .google-icon svg { width: 18px; height: 18px; }

    /* Footer */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.875rem;
      color: rgba(255,255,255,0.45);
    }

    .card-footer a {
      color: #60A5FA;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-footer a:hover { color: #93C5FD; }

    /* Loading spinner inside button */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
    }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg-mesh"></div>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Toast container -->
<div id="toastContainer" style="position:fixed;bottom:28px;right:28px;z-index:999;display:flex;flex-direction:column;gap:10px;"></div>

<!-- Login Card -->
<div class="login-card">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">📇</div>
    <div class="logo-name">Contact<span>Vault</span></div>
  </div>

  <h1 class="card-heading">Welcome back</h1>
  <p class="card-sub">Sign in to manage your contacts</p>

  <!-- Role Toggle -->
  <div class="role-row">
    <button class="role-btn active" id="roleUser" onclick="selectRole('user', this)">
      <span>👤</span>User
    </button>
    <button class="role-btn" id="roleAdmin" onclick="selectRole('admin', this)">
      <span>🛡️</span>Admin
    </button>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox">
    <span>⚠️</span>
    <span id="errorText"></span>
  </div>

  <!-- Form -->
  <div class="form-group">
    <label class="form-label">Email Address</label>
    <input type="email" id="email" class="form-input" placeholder="you@example.com" />
  </div>

  <div class="form-group">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-input" placeholder="Enter your password" />
  </div>

  <button class="btn-signin" id="loginBtn" onclick="handleLogin()">Sign In</button>

  <div class="divider">or continue with</div>

  <button class="btn-google" onclick="handleGoogleLogin()">
    <span class="google-icon">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.6 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.4 16.1 18.9 13 24 13c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.3 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.7l6.2 5.2C36.8 39.3 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/>
      </svg>
    </span>
    Continue with Google
  </button>

  <div class="card-footer">
    Don't have an account? <a href="register.html">Create one →</a>
  </div>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvZaj0f3dd6solN2rnz32aD6C-B5DnbQE",
    authDomain: "contactvault-cms.firebaseapp.com",
    projectId: "contactvault-cms",
    storageBucket: "contactvault-cms.firebasestorage.app",
    messagingSenderId: "137656530358",
    appId: "1:137656530358:web:1432d27521d77054fbfd17",
    measurementId: "G-LZ1EYVPHEF"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let selectedRole = 'user';

  window.selectRole = (role, el) => {
    selectedRole = role;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  };

  function showError(msg) {
    const box = document.getElementById('errorBox');
    document.getElementById('errorText').textContent = msg;
    box.classList.add('show');
    setTimeout(() => box.classList.remove('show'), 5000);
  }

  const redirectByRole = async (uid) => {
    const snap = await getDoc(doc(db, 'users', uid));
    if (!snap.exists()) {
      showError('Profile not found. Please register first.');
      return;
    }
    const role = snap.data().role;
    localStorage.setItem('userRole', role);
    localStorage.setItem('uid', uid);
    if (role === 'admin') window.location.href = '../pages/admin-dashboard.html';
    else                  window.location.href = '../pages/user-dashboard.html';
  };

  window.handleLogin = async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    if (!email || !password) { showError('Please fill in all fields.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const { user } = await signInWithEmailAndPassword(auth, email, password);
      localStorage.setItem('idToken', await user.getIdToken());
      btn.innerHTML = '✅ Redirecting…';
      await redirectByRole(user.uid);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
      const msgs = {
        'auth/user-not-found'    : 'No account found with this email.',
        'auth/wrong-password'    : 'Incorrect password. Try again.',
        'auth/invalid-email'     : 'Invalid email address.',
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/too-many-requests' : 'Too many attempts. Try again later.'
      };
      showError(msgs[err.code] || err.message);
    }
  };

  window.handleGoogleLogin = async () => {
    const btn = document.getElementById('loginBtn');
    try {
      const provider = new GoogleAuthProvider();
      const { user } = await signInWithPopup(auth, provider);

      // Auto-create profile on first Google sign-in
      const userRef = doc(db, 'users', user.uid);
      const snap    = await getDoc(userRef);
      if (!snap.exists()) {
        await setDoc(userRef, {
          uid      : user.uid,
          name     : user.displayName || 'Google User',
          email    : user.email,
          role     : selectedRole || 'user',
          photoURL : user.photoURL || null,
          createdAt: new Date().toISOString()
        });
      }

      localStorage.setItem('idToken', await user.getIdToken());
      await redirectByRole(user.uid);
    } catch (err) {
      showError(err.message);
    }
  };

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.handleLogin();
  });
</script>
</body>
</html>
